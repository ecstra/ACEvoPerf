[log]
enabled=1                         ; 1 writes acevo_perf.log next to the game
file=acevo_perf.log               ; name of that log file
hitch_ms=33                       ; log every frame slower than this many milliseconds

[directstorage]
bundled_runtime=1                 ; 1 uses the newer DirectStorage that comes with the mod
staging_buffer_mb=auto            ; loading buffer in video memory, auto sizes it for your card, or 128 to 1024, or 0 to leave the game's own
disable_bypass_io=0              ; 1 turns off fast disk reads, troubleshooting only
force_mapping_layer=0             ; 1 uses the slower compatibility path, troubleshooting only
force_file_buffering=0            ; 1 lets Windows cache the reads, troubleshooting only
disable_gpu_decompression=0       ; 1 unpacks files on the processor, troubleshooting only
disable_telemetry=1               ; 1 turns off DirectStorage telemetry
stats=1                           ; 1 writes loading numbers to the log, which helps when you report a problem
stats_interval_s=10               ; seconds between those numbers, 1 to 3600

[process]
priority=above_normal             ; processor priority, normal, above_normal or high
disable_power_throttling=1        ; 1 stops Windows slowing the game down to save power
timer_resolution_us=500           ; Windows timer precision in microseconds, 0 leaves it alone
gpu_priority=high                 ; graphics card priority, unchanged, normal, above_normal, high or realtime
working_set_floor_mb=0            ; MB of the game kept in memory, 0 leaves it to Windows

[engine]
streamer_reload_fix=1             ; 1 stops the game loading the same textures over and over
streamer_rank_fix=1               ; 1 ranks a texture by its most important use, so your car stays sharp near other cars
streamer_partial_loads=1          ; 1 loads the part of a texture that fits instead of waiting for all of it
responsive_ui=1                   ; 1 keeps the menus smooth and the frame pacing even while driving
session_leak_fix=1                ; 1 frees the memory each finished session leaves behind

[flags]
no_intro=true                     ; true skips the intro videos
force_canonical_pool_sizes=true   ; true stops textures going blurry after a race load or restart
tile_pool_mb=auto                 ; graphics card memory for textures in MB, auto picks it for your card

[latency]
reflex=1                          ; 1 turns on NVIDIA Reflex for less input lag, NVIDIA cards only
reflex_boost=0                    ; 1 trades more heat for a little less lag

[overlay]
enabled=1                         ; 1 loads replacement game files from the folder below
folder=acevo_mods                 ; folder next to the game that holds replacement files
fix_big_screens=1                 ; 1 makes the trackside video screens sharp

[dxgi]
enabled=1                         ; leave at 1, Reflex and the frame time measuring both need it
frame_stats=1                     ; 1 measures how long each frame takes, which hitch_ms and the developer CSVs need too, Reflex does not

[experimental]
tile_pool_from_budget=0           ; 1 sizes texture memory from what your card has free and your screen, more on cards over 6 GB, can slow the game down if the card runs out

[developer]
timeline=0                        ; 1 writes acevo_perf_timeline.csv, one line per second
frames=0                          ; 1 writes acevo_perf_frames.csv, one line per frame
streaming_trace=0                 ; 1 writes acevo_perf_streaming.csv, details of texture loading
log_requests=0                    ; 1 logs every file request, makes the log very long and can carry file names from your PC
throw_log=0                       ; 1 counts the game's internal errors in the log, which can carry file paths from your PC
trace_file_io=0                   ; 1 logs the game's first 200 file reads
load_sampler=0                    ; 1 writes acevo_perf_load_samples.csv, what loading spends processor time on, slows the game
sample_us=1000                    ; microseconds between those recordings, 100 to 1000000
ui_probe=0                        ; 1 measures where the game's menus and HUD lose their time
hud_schedule_test=0               ; 1 changes how the HUD updates every 10 seconds, to measure the 1 percent lows
memory_census=0                   ; 1 writes acevo_perf_memory.csv, what the game's memory is made of, pauses the game for a moment in the menu
