; ACEvoPerf - Assetto Corsa EVO performance mod configuration
; Lives next to AssettoCorsaEVO.exe together with dstorage.dll (the mod) and
; dstorage_orig.dll (the original Microsoft DirectStorage runtime).
; A line starting with ';' is a comment. Changes apply on the next game start.

[log]
enabled=1
file=acevo_perf.log
; acevo_perf_timeline.csv: one line per second with fps, hitches, streaming
; volume, VRAM use against budget, CPU load and memory. Off by default, 1 turns it on.
timeline=0
; acevo_perf_frames.csv: one line per presented frame (about 1 MB per 10 minutes).
; Off by default, 1 turns it on.
frames=0
; Frames slower than this many milliseconds are logged individually in acevo_perf.log.
hitch_ms=33
; Diagnostics: count the C++ exceptions the game throws and log the busiest
; throw sites with their type and message every ten seconds. Off by default.
throw_log=0

[directstorage]
; The game asks DirectStorage for a 1024 MB staging buffer, and the runtime
; keeps two of them in VRAM (about 2 GB). The engine then sizes its texture
; tile pool and mesh pool from whatever VRAM is left, which on a 6 GB GPU
; collapses to ~400 MB each. Capping the staging buffer gives that VRAM back:
;   1024 MB (game default) -> pools 400 MB      128 MB -> pools ~1115 MB
; The largest request the game issues is 32 MB, so 128 MB keeps 4 of them in
; flight. auto picks from the card's memory: 128 MB under 7 GB, 192 MB under
; 11 GB, 256 MB above. A number sets it directly, 0 = untouched.
staging_buffer_mb=auto
; Raise every queue to at least this many slots (128..8192). The game already
; uses 8192, the maximum, so 0 (unchanged) is right.
min_queue_capacity=0
; 0 = runtime decides. Worker threads that submit I/O.
submit_threads=0
; CPU decompression threads (GDeflate CPU fallback only; the game streams
; uncompressed data). 0 = auto, -1 = none.
cpu_decompression_threads=0
; Diagnostics / fallbacks. Leave at 0 unless acevo_perf.log shows I/O errors.
disable_bypass_io=0
force_mapping_layer=0
force_file_buffering=0
disable_gpu_decompression=0
disable_telemetry=1
; Priority of the texture tile queue (the engine creates it as "GpuUpload File Queue"
; at normal priority): unchanged | low | normal | high | realtime.
tile_queue_priority=unchanged
; Per-queue streaming statistics in the log (cheap). log_requests=1 logs every
; request (very verbose, only for analysis).
stats=1
stats_interval_s=10
log_requests=0

[process]
; normal | above_normal | high
priority=above_normal
; Opt the game out of Windows power throttling (EcoQoS) and make its timer
; resolution requests always honoured, even when the window is not focused.
disable_power_throttling=1
; Requested system timer resolution in microseconds (0 = do not touch).
timer_resolution_us=500
; GPU scheduling priority. Windows gives every process a priority class for its GPU
; work, separate from the CPU one, and nothing sets it for this game. It decides
; whose work the GPU scheduler runs first when something else is drawing too, a
; browser, an overlay, or on a laptop the integrated chip compositing the desktop.
; unchanged | normal | above_normal | high | realtime. realtime needs a privilege the
; game does not have and falls back to high.
gpu_priority=high
; Keep at least this many MB of the game resident so Windows cannot page it out under
; memory pressure and fault it back in mid corner. 0 = leave it to Windows, which is
; the default because a floor that is too big for the machine is refused, and one met
; by squeezing everything else is worse than the trimming it prevents. 2048 is a
; sensible try on a 16 GB machine.
working_set_floor_mb=0

[flags]
; Engine flags (gflags). The mod locates FLAGS_<name> inside the game exe at
; start-up and writes the value directly, so any bool / int32 / double flag from
; tools\data\gflags_full.tsv works here (string flags are not supported). Names not
; present in the running build are ignored and reported in acevo_perf.log.
;
; Pipeline-state cache: fewer shader compilation stalls after the first run of
; each track and car combination. The release build ships it off and so does the
; mod now, because two users reported that with it on the car's own headlights
; stop lighting the trees at night (unlit track too at Oulton Park). The cache
; lives in Saved Games\ACE\pipeline.library, outside the game folder, and is not
; invalidated when the game updates. Set this to true only if you want the
; shader stalls back, and delete pipeline.library whenever the game updates.
enable_pso_cache=false
; Skip intro scenes.
no_intro=true
;
; Fixed streaming pool sizes. The engine normally sizes its texture tile pool
; from the VRAM left over during a scene transition, while the previous scene
; is still resident: on a 6 GB card the menu gets 1117 MB, a race only 633 MB
; and a restarted session 526 MB, which is what makes the road and tyres turn
; to mush. With both flags the tile pool is created at tile_pool_mb and never
; resized, and the mesh budget is the engine's canonical 1433 MB.
; auto picks the pool from the card's memory: 1024 MB under 7 GB, 1536 under
; 11 GB, 2048 under 15 GB, 3072 above. A number sets it directly. Watch
; vram_used_mb against vram_budget_mb in the timeline.
force_canonical_pool_sizes=true
tile_pool_mb=auto
; --- optional (remove the leading ';' to enable) ---
; Fewer per-frame graphics updates for cars you are not looking at (CPU).
; Defaults: animations 3, complete 2, max interval 20 frames.
;car_update_animations_budget=2
;car_update_complete_budget=1
; Global-illumination probes refreshed per frame (default 16). Lower = less
; GPU time per frame, slower lighting convergence after time-of-day changes.
;gibake_probes_per_frame=8
; Disable the dynamic track (rubber/marbles) simulation to save CPU.
;disable_dynamic_track=true
; Disable variable rate shading (on by default; only if you see artifacts).
;disable_vrs=true
; Diagnostics: write a game log line for every pipeline state object created.
;log_pso_on_creation=true
; Do NOT set minimumcores=true: it shrinks the render/physics/loading pools
; (measured 5/6/2 -> 2/2/1 threads).

[latency]
; NVIDIA Reflex. The game has no Reflex support of its own, this adds it.
; It is NOT a frame rate limiter and it never caps anything: the frame rate stays
; unlocked. What it does is stop the CPU queueing frames further ahead of the GPU
; than it can actually use, so the input behind a frame is newer and one late frame
; is less able to drag the next one with it.
; NVIDIA only, and careful about it: the mod checks the vendor of the adapter the
; game actually renders on, and on an AMD or Intel one it never loads NVIDIA's
; library at all. Having an NVIDIA driver installed is not enough, it has to be the
; card doing the rendering. The log says which way it went, once, at start.
reflex=1
; Low latency boost keeps the GPU clocks up instead of letting them drop when the
; game is waiting. Slightly lower latency, more power and heat, which on a laptop
; usually means hitting the thermal limit sooner. Off by default.
reflex_boost=0

[profile]
; Load sampler. Finds the threads burning the most CPU, reads their instruction
; pointer a few thousand times a second and says what they were doing, by module
; and by function. It answers where a session load spends its time. It suspends
; game threads to read them, so it is a diagnostic and not something to leave on:
; turn it on for one load, quit, read acevo_perf_load_samples.csv and the
; [loadsampler] lines in acevo_perf.log, then turn it off again.
load_sampler=0
; Microseconds between samples, spread round robin over the busy threads. 1000 is
; a thousand a second, which over a thirteen second load is plenty and costs the
; game almost nothing.
sample_us=1000

[overlay]
; Loose file overlay. Files under <game folder>\<folder>\<package path> replace
; the entry of the same path inside content.kspkg, new paths are added. Example:
;   acevo_mods\content\<same folders as in the package>\<file>
; The package on disk is never modified. The layer stays idle when the folder
; does not exist. Every override is listed in acevo_perf.log at start.
enabled=1
folder=acevo_mods
; Override entries are served as plain files (the engine's XOR flag cleared).
clear_xor_flag=1
; Diagnostics: log the game's own file reads on the package (first 200).
trace_file_io=0

[dxgi]
; Hook swap chain creation. Needed for frame timing in the timeline.
enabled=1
; Measure frame times through the swap chain Present call.
frame_stats=1
