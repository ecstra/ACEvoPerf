[log]
enabled=1                         ; write acevo_perf.log
file=acevo_perf.log               ; log file name
hitch_ms=33                       ; log frames slower than this, in ms

[directstorage]
bundled_runtime=1                 ; the mod's DirectStorage 1.3.0, 0 = the game's own
staging_buffer_mb=auto            ; auto or MB, 0 = the game's 1024 MB
min_queue_capacity=0              ; 0 = unchanged
submit_threads=0                  ; 0 = runtime decides
cpu_decompression_threads=0       ; 0 = auto, -1 = none
disable_bypass_io=0               ; fallback, leave at 0
force_mapping_layer=0             ; fallback, leave at 0
force_file_buffering=0            ; fallback, leave at 0
disable_gpu_decompression=0       ; fallback, leave at 0
disable_telemetry=1               ; no DirectStorage telemetry
tile_queue_priority=unchanged     ; unchanged, low, normal, high, realtime
stats=1                           ; queue stats in the log
stats_interval_s=10               ; seconds between stats

[process]
priority=above_normal             ; normal, above_normal, high
disable_power_throttling=1        ; no Windows power throttling
timer_resolution_us=500           ; 0 = untouched
gpu_priority=high                 ; unchanged, normal, above_normal, high, realtime
working_set_floor_mb=0            ; MB kept in RAM, 0 = off

[engine]
streamer_reload_fix=1             ; stops texture reload churn

[flags]
enable_pso_cache=false            ; true breaks headlights at night
no_intro=true                     ; skip intros
force_canonical_pool_sizes=true   ; fixed pool sizes, sharp textures
tile_pool_mb=auto                 ; texture pool, auto or MB

[latency]
reflex=1                          ; NVIDIA Reflex, not a frame cap
reflex_boost=0                    ; more power and heat

[overlay]
enabled=1                         ; load files from the folder below
folder=acevo_mods                 ; replaces package files
clear_xor_flag=1                  ; serve them as plain files
fix_big_screens=1                 ; sharp trackside screens

[dxgi]
enabled=1                         ; needed for frame timing
frame_stats=1                     ; measure frame times

[developer]
timeline=0                        ; acevo_perf_timeline.csv
frames=0                          ; acevo_perf_frames.csv
streaming_trace=0                 ; acevo_perf_streaming.csv
log_requests=0                    ; log every DirectStorage request
throw_log=0                       ; log game exceptions
trace_file_io=0                   ; log the first 200 package reads
load_sampler=0                    ; CPU sampler, one load at a time
sample_us=1000                    ; microseconds between samples
